<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeFinder | Discover Your Next Meal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .recipe-card:hover .recipe-image { transform: scale(1.05); }
        .modal-overlay { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        foodie: {
                            primary: '#10b981', // Emerald 500
                            secondary: '#f59e0b', // Amber 500
                            accent: '#10b981',
                            light: '#ecfdf5'
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

    <!-- Navbar -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-foodie-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-foodie-primary/20">
                    <i data-lucide="utensils-crosses" class="w-6 h-6"></i>
                </div>
                <span class="text-2xl font-bold bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">Recipe<span class="text-foodie-primary">Finder</span></span>
            </div>
            <div class="hidden sm:flex items-center gap-8 text-sm font-medium text-gray-500">
                <a href="#" class="hover:text-foodie-primary transition-colors">Browse</a>
                <a href="#" class="hover:text-foodie-primary transition-colors">Categories</a>
                <a href="#" class="hover:text-foodie-primary transition-colors">Saved</a>
                <button class="bg-gray-900 text-white px-5 py-2.5 rounded-full hover:bg-gray-800 transition-all shadow-md">Sign In</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Hero & Search Section -->
        <div class="max-w-3xl mx-auto text-center mb-16">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-gray-900 mb-6">
                What's in your <span class="text-foodie-primary">kitchen?</span>
            </h1>
            <p class="text-lg text-gray-500 mb-10">Enter ingredients you have, and we'll find the perfect recipes for you.</p>

            <!-- Search Bar Container -->
            <div class="relative group">
                <form id="search-form" class="relative flex flex-wrap items-center bg-white rounded-3xl p-2 shadow-2xl shadow-gray-200 border border-gray-100 focus-within:ring-2 focus-within:ring-foodie-primary/20 transition-all">
                    <div id="tags-container" class="flex flex-wrap gap-2 px-3 py-2 items-center">
                        <!-- Tags will be injected here -->
                    </div>
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Add ingredient (e.g. chicken, pasta)..."
                        class="flex-1 min-w-[200px] outline-none py-3 px-4 text-gray-700 bg-transparent"
                    >
                    <div class="flex items-center gap-2 pr-2">
                        <button type="button" id="clear-all" class="p-3 text-gray-400 hover:text-red-500 transition-colors hidden">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                        <button type="submit" aria-label="Search" class="bg-foodie-primary text-white p-4 rounded-2xl hover:bg-foodie-primary/90 transition-all shadow-lg shadow-foodie-primary/30">
                            <i data-lucide="search" class="w-6 h-6"></i>
                        </button>
                    </div>
                </form>
                <p class="mt-4 text-sm text-gray-400">Press <kbd class="px-2 py-1 bg-gray-100 rounded text-xs">Enter</kbd> or <kbd class="px-2 py-1 bg-gray-100 rounded text-xs">,</kbd> to add tags</p>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status-message" class="mb-8 hidden">
            <h2 class="text-gray-500 font-medium">
                Showing recipes for <span id="active-tags-display" class="text-gray-900 font-bold"></span>
                <span id="partial-match-warning" class="ml-2 text-orange-600 hidden">(Partial matches)</span>
            </h2>
        </div>

        <!-- Recipe Grid -->
        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Loading and empty states will be handled here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="recipe-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
        <div class="bg-white rounded-[2.5rem] w-full max-w-4xl max-h-[90vh] overflow-hidden shadow-2xl relative flex flex-col sm:flex-row animate-fade-in">
            <button id="close-modal" class="absolute top-6 right-6 z-10 p-2 bg-white/90 backdrop-blur rounded-full shadow-lg hover:bg-white transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <!-- Modal Content (to be filled by JS) -->
            <div id="modal-content" class="flex flex-col sm:flex-row w-full h-full overflow-y-auto custom-scrollbar">
                <!-- Left: Image (Hero) -->
                <div class="w-full sm:w-2/5 h-64 sm:h-auto sticky top-0">
                    <img id="modal-image" src="" alt="" class="w-full h-full object-cover">
                </div>
                <!-- Right: Details -->
                <div class="w-full sm:w-3/5 p-8 sm:p-12">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span id="modal-category" class="px-3 py-1 bg-foodie-light text-foodie-primary rounded-full text-xs font-bold uppercase tracking-wider"></span>
                        <span id="modal-area" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold uppercase tracking-wider"></span>
                    </div>
                    <h2 id="modal-title" class="text-3xl font-extrabold text-gray-900 mb-8"></h2>

                    <div class="mb-10">
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <i data-lucide="shopping-basket" class="w-5 h-5 text-foodie-primary"></i>
                            Ingredients
                        </h3>
                        <div id="modal-ingredients" class="bg-gray-50 rounded-3xl p-6">
                            <!-- Table injected here -->
                        </div>
                    </div>

                    <div class="mb-10">
                        <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                            <i data-lucide="cooking-pot" class="w-5 h-5 text-foodie-primary"></i>
                            Instructions
                        </h3>
                        <div id="modal-instructions" class="text-gray-600 leading-relaxed whitespace-pre-line text-sm"></div>
                    </div>

                    <a id="modal-youtube" href="#" target="_blank" class="inline-flex items-center justify-center gap-3 bg-red-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-red-700 transition-all shadow-xl shadow-red-200">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                        Watch on YouTube
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let tags = [];
        let recipes = [];
        let isLoading = false;

        // DOM Elements
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const tagsContainer = document.getElementById('tags-container');
        const clearAllBtn = document.getElementById('clear-all');
        const recipeGrid = document.getElementById('recipe-grid');
        const statusMessage = document.getElementById('status-message');
        const activeTagsDisplay = document.getElementById('active-tags-display');
        const partialMatchWarning = document.getElementById('partial-match-warning');
        const modal = document.getElementById('recipe-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const modalContent = document.getElementById('modal-content');

        // Initialize Lucide Icons
        function refreshIcons() {
            lucide.createIcons();
        }
        refreshIcons();

        // Tag Logic
        function addTag(value) {
            const cleanValue = value.trim().toLowerCase();
            if (cleanValue && !tags.includes(cleanValue)) {
                tags.push(cleanValue);
                renderTags();
                updateClearAllVisibility();
            }
            searchInput.value = '';
        }

        function removeTag(tagToRemove) {
            tags = tags.filter(t => t !== tagToRemove);
            renderTags();
            updateClearAllVisibility();
            if (tags.length === 0) {
                recipes = [];
                renderRecipes();
                statusMessage.classList.add('hidden');
            } else {
                performSearch();
            }
        }

        function renderTags() {
            tagsContainer.innerHTML = '';
            tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'flex items-center gap-1.5 bg-foodie-light text-foodie-primary px-3 py-1.5 rounded-full text-sm font-semibold border border-foodie-primary/20 animate-fade-in';
                tagEl.innerHTML = `
                    ${tag}
                    <button type="button" class="hover:text-foodie-primary/70 transition-colors" onclick="removeTag('${tag}')">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                `;
                tagsContainer.appendChild(tagEl);
            });
            refreshIcons();
        }

        function updateClearAllVisibility() {
            if (tags.length > 0) {
                clearAllBtn.classList.remove('hidden');
            } else {
                clearAllBtn.classList.add('hidden');
            }
        }

        // Event Listeners
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                addTag(searchInput.value);
            }
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (searchInput.value) addTag(searchInput.value);
            if (tags.length > 0) performSearch();
        });

        clearAllBtn.addEventListener('click', () => {
            tags = [];
            recipes = [];
            renderTags();
            updateClearAllVisibility();
            renderRecipes();
            statusMessage.classList.add('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModalBtn.click();
        });

        // Search API Integration
        async function performSearch() {
            if (tags.length === 0) return;

            isLoading = true;
            renderLoading();
            statusMessage.classList.add('hidden');

            try {
                const resultsPerTag = await Promise.all(tags.map(async (tag) => {
                    const cleanTag = tag.toLowerCase().trim();
                    const [ingData, nameData] = await Promise.all([
                        fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${cleanTag}`).then(r => r.json()),
                        fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${cleanTag}`).then(r => r.json())
                    ]);

                    return {
                        tag: cleanTag,
                        meals: [...(ingData.meals || []), ...(nameData.meals || [])]
                    };
                }));

                const mealMap = new Map();

                resultsPerTag.forEach(({ tag, meals }) => {
                    meals.forEach(meal => {
                        if (mealMap.has(meal.idMeal)) {
                            const entry = mealMap.get(meal.idMeal);
                            entry.matchedTags.add(tag);
                            if (meal.strMeal.toLowerCase() === tag) {
                                entry.isExactMatch = true;
                            }
                        } else {
                            mealMap.set(meal.idMeal, {
                                ...meal,
                                matchedTags: new Set([tag]),
                                isExactMatch: meal.strMeal.toLowerCase() === tag
                            });
                        }
                    });
                });

                const processedResults = Array.from(mealMap.values()).map(meal => ({
                    ...meal,
                    matchCount: meal.matchedTags.size
                }));

                // Sort by Match Count then Exact Match
                recipes = processedResults.sort((a, b) => {
                    if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
                    return (b.isExactMatch ? 1 : 0) - (a.isExactMatch ? 1 : 0);
                });

                renderRecipes();

                // Update Status
                if (recipes.length > 0) {
                    statusMessage.classList.remove('hidden');
                    activeTagsDisplay.textContent = tags.join(', ');
                    if (recipes[0].matchCount < tags.length) {
                        partialMatchWarning.classList.remove('hidden');
                    } else {
                        partialMatchWarning.classList.add('hidden');
                    }
                }

            } catch (error) {
                console.error("Search failed:", error);
                recipes = null;
                renderRecipes();
            } finally {
                isLoading = false;
            }
        }

        function renderLoading() {
            recipeGrid.innerHTML = Array(8).fill(0).map(() => `
                <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-sm border border-gray-100 p-4">
                    <div class="aspect-square bg-gray-100 rounded-3xl mb-4 animate-pulse"></div>
                    <div class="h-6 bg-gray-100 rounded-full w-3/4 mb-2 animate-pulse"></div>
                    <div class="h-4 bg-gray-100 rounded-full w-1/2 animate-pulse"></div>
                </div>
            `).join('');
        }

        function renderRecipes() {
            if (!recipes || recipes.length === 0) {
                if (tags.length === 0) {
                    recipeGrid.innerHTML = '';
                    return;
                }
                recipeGrid.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center">
                        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 mb-6">
                            <i data-lucide="search-x" class="w-12 h-12"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">No recipes found</h3>
                        <p class="text-gray-500 max-w-sm">We couldn't find any recipes matching those ingredients. Try searching for something else!</p>
                    </div>
                `;
                refreshIcons();
                return;
            }

            recipeGrid.innerHTML = recipes.map(recipe => {
                const isPerfect = recipe.matchCount === tags.length;
                return `
                    <div class="recipe-card group bg-white rounded-[2.5rem] overflow-hidden shadow-sm hover:shadow-2xl hover:shadow-foodie-primary/10 border border-gray-100 transition-all duration-500 cursor-pointer animate-fade-in" onclick="openRecipe('${recipe.idMeal}')">
                        <div class="relative aspect-[4/5] overflow-hidden">
                            <img src="${recipe.strMealThumb}" alt="${recipe.strMeal}" class="recipe-image w-full h-full object-cover transition-transform duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

                            <div class="absolute top-4 left-4 flex flex-col gap-2">
                                ${isPerfect ? `
                                    <span class="bg-foodie-primary text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-lg shadow-foodie-primary/20">
                                        Perfect Match
                                    </span>
                                ` : `
                                    <span class="bg-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-lg shadow-amber-500/20">
                                        Matches ${recipe.matchCount}/${tags.length}
                                    </span>
                                `}
                                ${recipe.isExactMatch ? `
                                    <span class="bg-white/90 backdrop-blur text-gray-900 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest shadow-lg">
                                        Exact Name Match
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                        <div class="p-6">
                            <h3 class="font-bold text-lg text-gray-900 mb-4 line-clamp-1 group-hover:text-foodie-primary transition-colors">${recipe.strMeal}</h3>
                            <div class="flex items-center justify-between">
                                <button type="button" class="text-xs font-semibold text-gray-400 uppercase tracking-widest hover:text-foodie-primary transition-colors">View Recipe</button>
                                <div class="w-10 h-10 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-foodie-primary group-hover:text-white transition-all duration-300">
                                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            refreshIcons();
        }

        async function openRecipe(id) {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            // Show skeleton or clear previous
            modalContent.innerHTML = `
                <div class="flex items-center justify-center w-full h-96">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-foodie-primary border-t-transparent"></div>
                </div>
            `;

            try {
                const response = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`);
                const data = await response.json();
                const meal = data.meals[0];

                const ingredients = [];
                for (let i = 1; i <= 20; i++) {
                    if (meal[`strIngredient${i}`]) {
                        ingredients.push({
                            ingredient: meal[`strIngredient${i}`],
                            measure: meal[`strMeasure${i}`]
                        });
                    }
                }

                modalContent.innerHTML = `
                    <!-- Left: Image -->
                    <div class="w-full sm:w-2/5 h-64 sm:h-auto sticky top-0">
                        <img src="${meal.strMealThumb}" alt="${meal.strMeal}" class="w-full h-full object-cover">
                    </div>
                    <!-- Right: Details -->
                    <div class="w-full sm:w-3/5 p-8 sm:p-12">
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-3 py-1 bg-foodie-light text-foodie-primary rounded-full text-xs font-bold uppercase tracking-wider">${meal.strCategory}</span>
                            <span class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-bold uppercase tracking-wider">${meal.strArea}</span>
                        </div>
                        <h2 class="text-3xl font-extrabold text-gray-900 mb-8">${meal.strMeal}</h2>

                        <div class="mb-10">
                            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <i data-lucide="shopping-basket" class="w-5 h-5 text-foodie-primary"></i>
                                Ingredients
                            </h3>
                            <div class="bg-gray-50 rounded-3xl p-6">
                                <table class="w-full text-sm text-left">
                                    <tbody>
                                        ${ingredients.map(ing => `
                                            <tr class="border-b border-gray-100 last:border-0">
                                                <td class="py-3 font-medium text-gray-700 capitalize">${ing.ingredient}</td>
                                                <td class="py-3 text-right text-foodie-primary font-bold">${ing.measure}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="mb-10">
                            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <i data-lucide="cooking-pot" class="w-5 h-5 text-foodie-primary"></i>
                                Instructions
                            </h3>
                        <div id="modal-instructions" class="text-gray-600 leading-relaxed whitespace-pre-line text-sm">${meal.strInstructions}</div>
                        </div>

                        ${meal.strYoutube ? `
                        <a id="modal-youtube" href="${meal.strYoutube}" target="_blank" class="inline-flex items-center justify-center gap-3 bg-red-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-red-700 transition-all shadow-xl shadow-red-200">
                                <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                                Watch on YouTube
                            </a>
                        ` : ''}
                    </div>
                `;
                refreshIcons();

            } catch (error) {
                modalContent.innerHTML = `<div class="p-12 text-center text-red-500">Failed to load recipe details.</div>`;
            }
        }
    </script>
</body>
</html>
